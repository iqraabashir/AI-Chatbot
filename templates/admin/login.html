<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
</head>
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        background: #f3f3f3;
        flex-direction: column;
        margin: 0;
    }
    h2, h3 {
        text-align: top;
    }   

    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    input[type="text"],
    input[type="password"] {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 6px;
        box-sizing: border-box;
        border: 1px solid #ddd;
        border-radius: 5px;

    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    .error-message {
        color: red;
        margin-top: 10px;
    }
</style>
<body>

    <h2>Cluster University AI Assistant</h2>
    <h3>Admin Login</h3>

<form action="/admin/login" method="POST">
   <input type="text" name="username" placeholder="Username" required> <br><br>
   <input type="password" name="password" placeholder="Password" required> <br><br>
   <button type="submit"> Login </button>
</form>

{% if error %}
<p style="color:red;">
    {{ error }}
</p>
{% endif %}
</body>
</html>
